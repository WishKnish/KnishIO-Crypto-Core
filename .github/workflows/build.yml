# kcore build + test on real runners, shared by ci.yml (every push/PR) and publish.yml (tags).
#
#   gate         Linux x64: clang-22 build, ctest, relocated-package consumer gate, clang-tidy
#   native       ctest on Linux arm64, macOS arm64, macOS x86_64 and Windows x64 (MSVC, portable)
#   dist-*       the eight distribution packages (scripts/build-dist.sh) plus their artifact checks
#   dist-test    each downloaded test bundle run on the hardware it targets
#
# Artifacts: pkg-<target> (released by publish.yml) and tests-<target> (never released).
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version (CMakeLists.txt project VERSION)'
        required: true
        type: string

permissions:
  contents: read

env:
  # Matches ziglang.org/download/index.json 0.16.0 x86_64-linux shasum (checked 2026-09-29).
  ZIG_URL: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
  ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00

jobs:
  gate:
    name: gate (clang-22 build, ctest, package, clang-tidy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive   # external/mlkem-native
          persist-credentials: false

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config python3 binutils lsb-release wget \
            software-properties-common gnupg

      # .clang-tidy was tuned against LLVM 22 (the C SDK gate); pin it for a reproducible check set.
      - name: Install LLVM 22 (clang + clang-tidy)
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install -y clang-tidy-22

      - name: Configure
        run: |
          CC=clang-22 cmake -S . -B build -DKCORE_BUILD_TESTS=ON \
            -DCLANG_TIDY_EXE="$(command -v clang-tidy-22)"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ctest (selftest, selftest_noavx2, loadtest, exports)
        run: ctest --test-dir build --output-on-failure -V

      - name: 'Consumer build gate (relocated package: header, -I/-L, pkg-config, find_package)'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cmake --install build --prefix "$RUNNER_TEMP/stage/pkg"
          bash packaging/check-release-package.sh "$RUNNER_TEMP/stage/pkg" "$VERSION"

      - name: clang-tidy (lint gate)
        run: cmake --build build --target lint

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure
        run: cmake -S . -B build -DKCORE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: ctest
        run: ctest --test-dir build -C Release --output-on-failure -V

      - name: Consumer build gate (macOS arm64)
        if: matrix.os == 'macos-15'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          brew install pkg-config
          cmake --install build --config Release --prefix "$RUNNER_TEMP/stage/pkg"
          bash packaging/check-release-package.sh "$RUNNER_TEMP/stage/pkg" "$VERSION"

  dist-linux:
    name: dist (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        target: [linux-x64-gnu, linux-arm64-gnu, linux-x64-musl, linux-arm64-musl, windows-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install zig 0.16.0 (sha256-pinned)
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" "$ZIG_URL"
          echo "$ZIG_SHA256  $RUNNER_TEMP/zig.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"

      - name: Install mingw objdump (PE export check)
        if: matrix.target == 'windows-x64'
        run: sudo apt-get update && sudo apt-get install -y binutils-mingw-w64-x86-64

      - name: Build package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/build-dist.sh "$TARGET" "$VERSION" dist

      - name: Check exports, glibc floor, DT_NEEDED and the arm64 baseline
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          P="dist/knishio-crypto-core-$VERSION-$TARGET"
          T="dist/kcore-tests-$VERSION-$TARGET"
          case "$TARGET" in
            windows-x64)
              OBJDUMP=x86_64-w64-mingw32-objdump sh scripts/check-exports.sh "$P/bin/kcore.dll" pe ;;
            *)
              sh scripts/check-exports.sh "$P/lib/libkcore.so" elf ;;
          esac
          case "$TARGET" in
            *-gnu)
              files=("$P/lib/libkcore.so")
              for f in kcore_selftest kcore_selftest_noavx2 kcore_loadtest; do
                if [ -f "$T/$f" ]; then files+=("$T/$f"); fi
              done
              sh scripts/check-glibc-floor.sh 2.17 "${files[@]}" ;;
          esac
          case "$TARGET" in
            linux-x64-gnu) sh scripts/check-needed.sh "$P/lib/libkcore.so" '^libc\.so\.6$' ;;
            linux-arm64-gnu) sh scripts/check-needed.sh "$P/lib/libkcore.so" '^(libc\.so\.6|ld-linux-aarch64\.so\.1)$' ;;
            *-musl) sh scripts/check-needed.sh "$P/lib/libkcore.so" '^libc\.so$' ;;
          esac
          # The ubuntu-24.04-arm test runners have SHA3 in hardware, so only the archive can prove
          # the Cortex-A72 baseline held.
          case "$TARGET" in
            linux-arm64-*) sh scripts/check-arm64-baseline.sh "$P/lib/libkcore.a" ;;
          esac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-${{ matrix.target }}
          path: dist/knishio-crypto-core-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tests-${{ matrix.target }}
          path: dist/kcore-tests-*-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  dist-darwin:
    name: dist (darwin-universal)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build package
        env:
          VERSION: ${{ inputs.version }}
        run: bash scripts/build-dist.sh darwin-universal "$VERSION" dist

      - name: Check exports, minos and the SHA3 backend
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          P="dist/knishio-crypto-core-$VERSION-darwin-universal"
          sh scripts/check-exports.sh "$P/lib/libkcore.dylib" macho
          for a in arm64 x86_64; do
            m=$(otool -arch "$a" -l "$P/lib/libkcore.dylib" | awk '/LC_BUILD_VERSION/ { f = 1 } f && /minos/ { print $2; exit }')
            echo "$a minos $m"
            [ "$m" = 11.0 ] || { echo "::error::$a slice minos is '$m', expected 11.0"; exit 1; }
          done
          n=$(nm -arch arm64 "$P/lib/libkcore.a" 2>/dev/null | grep -c v84a || true)
          echo "arm64 v84a symbols: $n"
          [ "$n" -gt 0 ] || echo "::warning::SHA3 backend not selected in the arm64 slice"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-darwin-universal
          path: dist/knishio-crypto-core-*-darwin-universal.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: tests-darwin-universal
          path: dist/kcore-tests-*-darwin-universal.tar.gz
          if-no-files-found: error

  dist-android:
    name: dist (android-arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # ANDROID_NDK_ROOT is emptied so build-dist.sh downloads the sha256-pinned r27d instead of
      # using whichever NDK the runner image ships.
      - name: Build package (NDK r27d, sha256-pinned)
        env:
          VERSION: ${{ inputs.version }}
          ANDROID_NDK_ROOT: ''
        run: bash scripts/build-dist.sh android-arm64-v8a "$VERSION" dist

      - name: Check exports, 16 KiB LOAD alignment, DT_NEEDED and the arm64 baseline
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          BIN=.toolchains/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/bin
          P="dist/knishio-crypto-core-$VERSION-android-arm64-v8a"
          SO="$P/lib/libkcore.so"
          READELF="$BIN/llvm-readelf" sh scripts/check-exports.sh "$SO" elf
          READELF="$BIN/llvm-readelf" sh scripts/check-needed.sh "$SO" '^(libc\.so|libdl\.so|libm\.so)$'
          NM="$BIN/llvm-nm" sh scripts/check-arm64-baseline.sh "$P/lib/libkcore.a"
          n=0
          for a in $("$BIN/llvm-readelf" -lW "$SO" | awk '$1 == "LOAD" { print $NF }'); do
            n=$((n + 1))
            echo "LOAD align $a"
            [ $((a)) -ge 16384 ] || { echo "::error::LOAD segment aligned to $a (< 0x4000)"; exit 1; }
          done
          [ "$n" -gt 0 ] || { echo "::error::no LOAD segments"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-android-arm64-v8a
          path: dist/knishio-crypto-core-*-android-arm64-v8a.tar.gz
          if-no-files-found: error

  dist-wasm:
    name: dist (wasm32)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build package (wasi-sdk-34, sha256-pinned)
        env:
          VERSION: ${{ inputs.version }}
          WASI_SDK_PATH: ''
        run: bash scripts/build-dist.sh wasm32 "$VERSION" dist

      - name: WASM check and exports
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          W="dist/knishio-crypto-core-$VERSION-wasm32/kcore.wasm"
          python3 tests/gen_vectors.py tests/fixtures/cross-platform-test-vectors.json "$RUNNER_TEMP/vectors"
          out=$(node tests/wasm_check.mjs "$W" "$RUNNER_TEMP/vectors/differential.json")
          echo "$out"
          [ "$out" = "WASMCHECK ok" ]
          sh scripts/check-exports.sh "$W" wasm

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pkg-wasm32
          path: dist/knishio-crypto-core-*-wasm32.tar.gz
          if-no-files-found: error

  dist-test:
    name: dist-test (${{ matrix.target }} on ${{ matrix.runner }})
    needs: [dist-linux, dist-darwin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, target: linux-x64-gnu, mode: gnu, avx2: '--expect-avx2' }
          - { runner: ubuntu-24.04, target: linux-x64-musl, mode: musl, avx2: '' }
          - { runner: ubuntu-24.04-arm, target: linux-arm64-gnu, mode: gnu, avx2: '' }
          - { runner: ubuntu-24.04-arm, target: linux-arm64-musl, mode: musl, avx2: '' }
          - { runner: macos-15, target: darwin-universal, mode: darwin-arm64, avx2: '' }
          - { runner: macos-15-intel, target: darwin-universal, mode: native, avx2: '--expect-avx2' }
          - { runner: windows-2025, target: windows-x64, mode: windows, avx2: '--expect-avx2' }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ inputs.version }}
      AVX2: ${{ matrix.avx2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: pkg-${{ matrix.target }}
          path: dist

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tests-${{ matrix.target }}
          path: dist

      - name: Extract
        run: |
          set -euo pipefail
          for f in dist/*.tar.gz; do tar -xzf "$f" -C dist; done
          echo "P=dist/knishio-crypto-core-$VERSION-$TARGET" >> "$GITHUB_ENV"
          echo "T=dist/kcore-tests-$VERSION-$TARGET" >> "$GITHUB_ENV"

      - name: Run tests (native)
        if: matrix.mode == 'gnu' || matrix.mode == 'native' || matrix.mode == 'darwin-arm64'
        run: |
          case "$TARGET" in
            darwin-*) LIB="$P/lib/libkcore.dylib" ;;
            *) LIB="$P/lib/libkcore.so" ;;
          esac
          # shellcheck disable=SC2086  # AVX2 is empty or one flag
          sh scripts/run-dist-tests.sh "$T" "$LIB" $AVX2

      # glibc 2.17 floor, exercised for real. centos:7 has an arm64 variant; the manylinux2014
      # images (also glibc 2.17) stand in if it cannot be pulled.
      - name: Run tests (glibc 2.17 container)
        if: matrix.mode == 'gnu'
        run: |
          set -euo pipefail
          img=centos:7
          if ! docker pull -q "$img"; then
            img="quay.io/pypa/manylinux2014_$(uname -m)"
            echo "::warning::centos:7 unavailable; using $img (glibc 2.17)"
          fi
          echo "image: $img"
          # shellcheck disable=SC2086
          docker run --rm -v "$PWD:/w" -w /w "$img" sh scripts/run-dist-tests.sh "$T" "$P/lib/libkcore.so" $AVX2

      - name: Consumer build gate on the downloaded package
        if: matrix.mode == 'gnu'
        run: bash packaging/check-release-package.sh "$P" "$VERSION"

      - name: Run tests (Alpine, musl)
        if: matrix.mode == 'musl'
        run: |
          docker run --rm -v "$PWD:/w" -w /w -e T -e P alpine:3.20 sh -c \
            'apk add --no-cache gcc musl-dev > /dev/null && sh scripts/run-dist-tests.sh "$T" "$P/lib/libkcore.so"'

      - name: Run tests (x86_64 slice under Rosetta)
        if: matrix.mode == 'darwin-arm64'
        run: |
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            softwareupdate --install-rosetta --agree-to-license || true
          fi
          if ! arch -x86_64 /usr/bin/true 2> /dev/null; then
            echo "::warning::Rosetta unavailable on this runner; x86_64 slice covered by macos-15-intel only"
            exit 0
          fi
          KCORE_RUN_PREFIX="arch -x86_64" sh scripts/run-dist-tests.sh "$T" "$P/lib/libkcore.dylib"

      - name: Run tests (Windows)
        if: matrix.mode == 'windows'
        run: |
          # LoadLibraryA wants a native path.
          # shellcheck disable=SC2086
          sh scripts/run-dist-tests.sh "$T" "$(cygpath -w "$PWD/$P/bin/kcore.dll")" $AVX2
